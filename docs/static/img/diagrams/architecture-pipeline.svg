<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Teleopit runtime pipelines</title>
  <desc id="desc">The main whole-body tracking pipeline runs from BVH or PICO input through GMR, a reference timeline, observation building, ONNX control, and a MuJoCo or Unitree G1 robot. A host policy can inject validated references, while optional PICO paths control hands and OpenNeck.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: Inter, Arial, sans-serif; }
      .title { font-size: 30px; font-weight: 700; fill: #0f172a; }
      .lane { font-size: 15px; font-weight: 700; fill: #475569; letter-spacing: .08em; }
      .box-title { font-size: 18px; font-weight: 700; fill: #0f172a; }
      .copy { font-size: 14px; fill: #475569; }
      .note { font-size: 14px; font-weight: 600; fill: #334155; }
      .arrow { fill: none; stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="760" rx="22" fill="#f8fafc"/>
  <text x="48" y="50" class="title">Teleopit runtime pipelines</text>

  <text x="48" y="94" class="lane">WHOLE-BODY TRACKING</text>
  <rect x="48" y="112" width="180" height="100" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5"/>
  <text x="138" y="151" class="box-title" text-anchor="middle">InputProvider</text>
  <text x="138" y="178" class="copy" text-anchor="middle">BVH · PICO body</text>

  <rect x="272" y="112" width="180" height="100" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="362" y="151" class="box-title" text-anchor="middle">GMR Retargeter</text>
  <text x="362" y="178" class="copy" text-anchor="middle">Human → G1 motion</text>

  <rect x="496" y="112" width="180" height="100" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text x="586" y="145" class="box-title" text-anchor="middle">Reference timeline</text>
  <text x="586" y="172" class="copy" text-anchor="middle">Root + 29 joints</text>
  <text x="586" y="193" class="copy" text-anchor="middle">time-aligned · smoothed</text>

  <rect x="720" y="112" width="180" height="100" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="810" y="145" class="box-title" text-anchor="middle">ObservationBuilder</text>
  <text x="810" y="172" class="copy" text-anchor="middle">velcmd_history</text>
  <text x="810" y="193" class="copy" text-anchor="middle">167D</text>

  <rect x="944" y="112" width="180" height="100" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="1034" y="145" class="box-title" text-anchor="middle">ONNX Controller</text>
  <text x="1034" y="172" class="copy" text-anchor="middle">TemporalCNN</text>
  <text x="1034" y="193" class="copy" text-anchor="middle">29D offsets</text>

  <rect x="1168" y="112" width="180" height="100" rx="16" fill="#e2e8f0" stroke="#475569" stroke-width="2.5"/>
  <text x="1258" y="151" class="box-title" text-anchor="middle">Robot</text>
  <text x="1258" y="178" class="copy" text-anchor="middle">MuJoCo · Unitree G1</text>

  <path d="M228 162 L262 162" class="arrow"/>
  <path d="M452 162 L486 162" class="arrow"/>
  <path d="M676 162 L710 162" class="arrow"/>
  <path d="M900 162 L934 162" class="arrow"/>
  <path d="M1124 162 L1158 162" class="arrow"/>

  <text x="48" y="302" class="lane">INDEPENDENT HOST-POLICY DEPLOYMENT</text>
  <rect x="48" y="322" width="220" height="96" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5"/>
  <text x="158" y="353" class="box-title" text-anchor="middle">Onboard observation</text>
  <text x="158" y="380" class="copy" text-anchor="middle">JPEG + 43D measured state</text>
  <text x="158" y="401" class="copy" text-anchor="middle">+ camera-time reference root</text>

  <rect x="340" y="322" width="220" height="96" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="450" y="359" class="box-title" text-anchor="middle">Host policy server</text>
  <text x="450" y="386" class="copy" text-anchor="middle">ZeroMQ · msgpack</text>

  <rect x="632" y="322" width="260" height="96" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text x="762" y="353" class="box-title" text-anchor="middle">Validator + scheduler</text>
  <text x="762" y="380" class="copy" text-anchor="middle">Timestamp alignment · safety</text>
  <text x="762" y="401" class="copy" text-anchor="middle">36D body reference</text>

  <path d="M268 370 L330 370" class="arrow"/>
  <path d="M560 370 L622 370" class="arrow"/>
  <path d="M762 322 C762 270 586 278 586 222" class="branch"/>
  <text x="842" y="276" class="note">Feeds the existing motion tracker</text>

  <text x="48" y="510" class="lane">OPTIONAL PICO-BASED ONBOARD PATHS · ONE SHARED PICOBRIDGE RECEIVER</text>
  <rect x="48" y="532" width="220" height="96" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5"/>
  <text x="158" y="568" class="box-title" text-anchor="middle">Hands / controllers</text>
  <text x="158" y="595" class="copy" text-anchor="middle">PICO tracking frame</text>

  <rect x="340" y="532" width="220" height="96" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="450" y="568" class="box-title" text-anchor="middle">Hand mapping</text>
  <text x="450" y="595" class="copy" text-anchor="middle">somehand · gripper</text>

  <rect x="632" y="532" width="220" height="96" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="742" y="568" class="box-title" text-anchor="middle">LinkerHand</text>
  <text x="742" y="595" class="copy" text-anchor="middle">L6 · O6</text>

  <path d="M268 580 L330 580" class="arrow"/>
  <path d="M560 580 L622 580" class="arrow"/>

  <rect x="48" y="650" width="220" height="72" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5"/>
  <text x="158" y="680" class="box-title" text-anchor="middle">HMD + Spine3</text>
  <text x="158" y="705" class="copy" text-anchor="middle">Same-frame rotations</text>

  <rect x="340" y="650" width="220" height="72" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="450" y="680" class="box-title" text-anchor="middle">Yaw / pitch mapping</text>
  <text x="450" y="705" class="copy" text-anchor="middle">Dead zone · pitch gain</text>

  <rect x="632" y="650" width="220" height="72" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="742" y="680" class="box-title" text-anchor="middle">OpenNeck</text>
  <text x="742" y="705" class="copy" text-anchor="middle">Physical degrees</text>

  <path d="M268 686 L330 686" class="arrow"/>
  <path d="M560 686 L622 686" class="arrow"/>
</svg>
