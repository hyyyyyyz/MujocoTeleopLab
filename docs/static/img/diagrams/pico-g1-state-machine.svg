<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Pico teleoperation state machine on Unitree G1</title>
  <desc id="desc">The G1 remote enters standing and starts or ends body tracking. The Pico controller switches arms mode or pauses. G1 remote L1 plus R1 enters damping from any state.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <marker id="danger-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#dc2626"/>
    </marker>
    <style>
      text { font-family: Inter, Arial, sans-serif; }
      .title { font-size: 28px; font-weight: 700; fill: #0f172a; }
      .group-label { font-size: 15px; font-weight: 700; fill: #475569; letter-spacing: .05em; }
      .state-title { font-size: 20px; font-weight: 700; fill: #0f172a; }
      .state-copy { font-size: 14px; fill: #475569; }
      .label { font-size: 14px; font-weight: 600; fill: #334155; }
      .danger-label { font-size: 15px; font-weight: 700; fill: #991b1b; }
      .arrow { fill: none; stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow); }
      .both { fill: none; stroke: #475569; stroke-width: 2.5; marker-start: url(#arrow); marker-end: url(#arrow); }
      .branch { fill: none; stroke: #94a3b8; stroke-width: 2.5; }
      .danger-arrow { fill: none; stroke: #dc2626; stroke-width: 2.5; stroke-dasharray: 8 6; marker-end: url(#danger-arrow); }
    </style>
  </defs>

  <rect width="1200" height="650" rx="20" fill="#f8fafc"/>
  <text x="60" y="52" class="title">Physical G1 control</text>

  <rect x="60" y="72" width="126" height="30" rx="15" fill="#dbeafe"/>
  <text x="123" y="92" class="label" text-anchor="middle">G1 remote</text>
  <rect x="198" y="72" width="158" height="30" rx="15" fill="#ede9fe"/>
  <text x="277" y="92" class="label" text-anchor="middle">Pico controller</text>

  <rect x="646" y="78" width="494" height="470" rx="22" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="672" y="111" class="group-label">LIVE VR SESSION</text>

  <rect x="54" y="222" width="220" height="104" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <circle cx="83" cy="248" r="8" fill="#dc2626"/>
  <text x="164" y="265" class="state-title" text-anchor="middle">DAMPING</text>
  <text x="164" y="293" class="state-copy" text-anchor="middle">Motors damped</text>

  <rect x="346" y="222" width="220" height="104" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5"/>
  <circle cx="375" cy="248" r="8" fill="#0284c7"/>
  <text x="456" y="265" class="state-title" text-anchor="middle">STANDING</text>
  <text x="456" y="293" class="state-copy" text-anchor="middle">Robot standing · tracking idle</text>

  <rect x="684" y="158" width="190" height="98" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <circle cx="713" cy="184" r="8" fill="#16a34a"/>
  <text x="779" y="200" class="state-title" text-anchor="middle">MOCAP</text>
  <text x="779" y="228" class="state-copy" text-anchor="middle">Whole-body tracking</text>

  <rect x="912" y="158" width="190" height="98" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <circle cx="941" cy="184" r="8" fill="#d97706"/>
  <text x="1007" y="200" class="state-title" text-anchor="middle">ARMS</text>
  <text x="1007" y="228" class="state-copy" text-anchor="middle">Arms-only tracking</text>

  <rect x="798" y="412" width="190" height="98" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="2.5"/>
  <circle cx="827" cy="438" r="8" fill="#64748b"/>
  <text x="893" y="454" class="state-title" text-anchor="middle">PAUSED</text>
  <text x="893" y="482" class="state-copy" text-anchor="middle">Hold current reference</text>

  <path d="M274 274 L346 274" class="arrow"/>
  <rect x="260" y="181" width="100" height="28" rx="14" fill="#dbeafe"/>
  <text x="310" y="200" class="label" text-anchor="middle">Start</text>

  <path d="M566 248 C606 248 629 207 684 207" class="arrow"/>
  <rect x="562" y="174" width="108" height="28" rx="14" fill="#dbeafe"/>
  <text x="616" y="193" class="label" text-anchor="middle">G1 remote Y</text>

  <path d="M646 320 C616 320 601 300 566 300" class="arrow"/>
  <rect x="565" y="339" width="159" height="28" rx="14" fill="#dbeafe"/>
  <text x="644" y="358" class="label" text-anchor="middle">G1 remote X · end</text>

  <path d="M874 207 L912 207" class="both"/>
  <rect x="815" y="122" width="156" height="28" rx="14" fill="#ede9fe"/>
  <text x="893" y="141" class="label" text-anchor="middle">Pico controller B</text>

  <path d="M779 256 C779 313 846 310 880 344" class="branch"/>
  <path d="M1007 256 C1007 313 940 310 906 344" class="branch"/>
  <circle cx="893" cy="345" r="5" fill="#64748b"/>
  <path d="M893 350 L893 412" class="both"/>
  <rect x="766" y="367" width="254" height="28" rx="14" fill="#eef2ff"/>
  <text x="893" y="386" class="label" text-anchor="middle">G1 remote B · Pico controller A</text>

  <path d="M1090 604 L164 604 L164 326" class="danger-arrow"/>
  <rect x="394" y="575" width="490" height="38" rx="19" fill="#fee2e2"/>
  <text x="639" y="599" class="danger-label" text-anchor="middle">Any state · G1 remote L1+R1 → DAMPING</text>
</svg>
