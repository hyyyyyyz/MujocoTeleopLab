name: mujoco-teleoplab

services:
  mujoco-teleoplab:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      # The 5090 server resolves external registries through the host network;
      # use the same path for apt/pip during image construction.
      network: host
      args:
        CUROBO_REVISION: ${CUROBO_REVISION:-a56e0f06db9efb99232586db18b18b323cb22c47}
        TORCH_VERSION: ${TORCH_VERSION:-2.7.1}
        TORCH_INDEX_CUDA: ${TORCH_INDEX_CUDA:-cu128}
        TORCH_CUDA_ARCH_LIST: ${TORCH_CUDA_ARCH_LIST:-12.0}
        BUILD_DNS_1: ${BUILD_DNS_1:-10.0.26.18}
        BUILD_DNS_2: ${BUILD_DNS_2:-10.0.26.19}
    image: mujoco-teleoplab:cuda
    working_dir: /workspace
    volumes:
      - ..:/workspace
      - ${HOME}/.cache/pip:/root/.cache/pip
      - ${HOME}/.cache/torch:/root/.cache/torch
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      DISPLAY: ${DISPLAY:-:0}
      MUJOCO_GL: ${MUJOCO_GL:-egl}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility,graphics,display}
      PYTHONPATH: /workspace
      SCENE_TORCH_PREINSTALLED: ${SCENE_TORCH_PREINSTALLED:-1}
    gpus: all
    ipc: host
    shm_size: 2gb
    network_mode: host
    stdin_open: true
    tty: true
    init: true

  # Python 3.12 XRoboToolkit SDK and PC Service.  This remains separate from
  # the CUDA/Python 3.10 scene image and sends normalized packets over the
  # host-network UDP endpoint 127.0.0.1:17600.
  xrbridge:
    build:
      context: ..
      dockerfile: docker/Dockerfile.xrbridge
      network: host
    image: mujoco-teleoplab:xrbridge
    working_dir: /workspace
    volumes:
      - ..:/workspace
      - ${HOME}/.Xauthority:/root/.Xauthority:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      PYTHONPATH: /workspace
      DISPLAY: ${DISPLAY:-:0}
      XAUTHORITY: /root/.Xauthority
      QT_X11_NO_MITSHM: "1"
    network_mode: host
    stdin_open: true
    tty: true
    init: true
    profiles: [teleop]

  # Optional all-Docker interactive scene target.  It expects the xrbridge
  # service above and forwards its MuJoCo GLFW window through the SSH X11
  # display.  Batch VLA generation should continue using the default service
  # with MUJOCO_GL=egl instead.
  scene-x11:
    image: mujoco-teleoplab:cuda
    working_dir: /workspace
    depends_on:
      - xrbridge
    volumes:
      - ..:/workspace
      - ${HOME}/.Xauthority:/root/.Xauthority:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      DISPLAY: ${DISPLAY:-:0}
      XAUTHORITY: /root/.Xauthority
      MUJOCO_GL: egl
      QT_X11_NO_MITSHM: "1"
      PYTHONPATH: /workspace
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility,graphics,display}
    gpus: all
    ipc: host
    shm_size: 2gb
    network_mode: host
    stdin_open: true
    tty: true
    init: true
    command:
      - bash
      - -lc
      - >-
        if [ ! -x .venv_scene/bin/python ] || [ ! -d third_party/decoupled_wbc/.git ]; then
        SCENE_TORCH_PREINSTALLED=1 bash scripts/setup/setup_scene_teleop.sh; fi &&
        .venv_scene/bin/python scripts/run/run_scene_teleop.py
        --scene robosuite-can
        --bridge-host 127.0.0.1
        --bridge-port 17600
        --video-host ${PICO_VIDEO_HOST:-10.0.90.191}
    profiles: [teleop]
